services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pa
      POSTGRES_PASSWORD: pa
      POSTGRES_DB: pa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pa"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
